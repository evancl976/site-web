    <main class="search-main">

    <script src="../Script/theme.js"></script>
    <script>
    const SITE_PAGES = [
      {"url":"Apprendre.html","title":"Apprendre à créer un site web — de A à Z","text":"apprendre créer site web html css javascript cours tuto débutant héberger github pages thème sombre"},
      {"url":"Page/Info.html","title":"Dans les Coulisses du Code – Fiche Technique","text":"fiche technique projet code globe 3d javascript architecture html sémantique bac"},
      {"url":"Page/Guadeloupe.html","title":"Guadeloupe – Menu Culinaire Traditionnel","text":"guadeloupe antilles bokit colombo accras recettes île"},
      {"url":"Page/Martinique.html","title":"Martinique – Menu Culinaire Traditionnel","text":"martinique antilles accras colombo recettes île"},
      {"url":"Page/La-reunion.html","title":"La Réunion – Menu Culinaire Traditionnel","text":"réunion océan indien rougail saucisse recettes île"},
      {"url":"Page/Guyane.html","title":"Guyane – Menu Culinaire Traditionnel","text":"guyane amazonie blaff boucanes recettes île"},
      {"url":"Page/Mayotte.html","title":"Mayotte – Menu Culinaire Traditionnel","text":"mayotte mayotte océan indien mataba recettes île"},
      {"url":"Page/guadeloupe/bokit.html","title":"Le Bokit — Guadeloupe","text":"bokit guadeloupe sandwich frit street food"},
      {"url":"Page/guadeloupe/boudin-noir.html","title":"Boudin Noir — Guadeloupe","text":"boudin-noir guadeloupe recette"},
      {"url":"Page/guadeloupe/colombo-poulet.html","title":"Colombo de Poulet — Guadeloupe","text":"colombo-poulet guadeloupe épices ragoût"},
      {"url":"Page/guadeloupe/Matete de crabe.html","title":"Matété de Crabe — Guadeloupe","text":"matété crabe guadeloupe riz"},
      {"url":"Page/guyane/blaff-de-poissons.html","title":"Blaff de Poissons — Guyane","text":"blaff poissons guyane citron piment"},
      {"url":"Page/guyane/boucanes.html","title":"Boucanés — Guyane","text":"boucané guyane viande fumée"},
      {"url":"Page/guyane/calalou.html","title":"Calalou — Guyane","text":"calalou guyane épinards crabe"},
      {"url":"Page/guyane/gratin-de-couac.html","title":"Gratin de Couac — Guyane","text":"gratin couac guyane manioc"},
      {"url":"Page/la-reunion/Bonbons-piments.html","title":"Bonbons Piments — La Réunion","text":"bonbons piments réunion frit"},
      {"url":"Page/la-reunion/cabri-massale.html","title":"Cabri Massalé — La Réunion","text":"cabri massalé réunion curry"},
      {"url":"Page/la-reunion/Civet-zourite.html","title":"Civet Zourite — La Réunion","text":"civet zourite réunion octopus"},
      {"url":"Page/la-reunion/Rougail-saucisse.html","title":"Rougail Saucisse — La Réunion","text":"rougail saucisse réunion plat épices"},
      {"url":"Page/martinique/accras-de-morue.html","title":"Accras de Morue — Martinique","text":"accras morue martinique beignet"},
      {"url":"Page/martinique/cobuillon-de-poisson.html","title":"Court-Bouillon de Poisson — Martinique","text":"court bouillon poisson martinique"},
      {"url":"Page/martinique/dombre.html","title":"Dombre — Martinique","text":"dombre martinique pâte"},
      {"url":"Page/martinique/tinen-et-morue.html","title":"Ti-Nain et Morue — Martinique","text":"ti nain morue martinique banane"},

      {"url":"Page/mayotte/kangue.html","title":"Kangue — Mayotte","text":"kangue mayotte tortue"},
      {"url":"Page/mayotte/mataba.html","title":"Mataba — Mayotte","text":"mataba mayotte manioc crabe"},
      {"url":"Page/mayotte/pilao.html","title":"Pilao — Mayotte","text":"pilao mayotte riz épices"}
    ];

    function goSearch() {
      const q = document.getElementById('q').value.trim();
      if (q) location.href = 'recherche.html?q=' + encodeURIComponent(q);
      return false;
    }

    function render(q) {
      q = (q || '').toLowerCase().trim();
      const res = document.getElementById('results');
      const empty = document.getElementById('empty');
      res.innerHTML = '';
      if (!q) {
        res.innerHTML = '<p class="search-hint">Tape un mot-clé ci-dessus pour lancer la recherche.</p>';
        empty.style.display = 'none';
        return;
      }
      const found = SITE_PAGES.filter(p =>
        p.title.toLowerCase().includes(q) || p.text.toLowerCase().includes(q) || p.url.toLowerCase().includes(q)
      );
      if (found.length === 0) {
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      found.forEach(p => {
        const a = document.createElement('a');
        a.className = 'search-result';
        a.href = p.url;
        a.innerHTML = '<span class="search-result__title">🔗 ' + p.title + '</span><span class="search-result__url">' + p.url + '</span>';
        res.appendChild(a);
      });
    }

    // Lit ?q= dans l'URL au chargement
    const params = new URLSearchParams(location.search);
    const q = params.get('q') || '';
    document.getElementById('q').value = q;
    render(q);
    </script>
</body>
</html>
