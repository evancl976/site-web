            - paragraph [ref=f1e294]: Incontournables de la culture "street food" locale, les bonbons piments sont les rois absolus de l'apéritif et des marchés forains de La Réunion. Ces petites bouchées frites, dégustées chaudes à tout moment de la journée, cachent sous leur robe dorée un cœur tendre d'une richesse aromatique explosive.
