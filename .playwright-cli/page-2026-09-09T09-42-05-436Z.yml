            - paragraph [ref=f1e104]: Incontournables de la table guyanaise, les boucanés sont des viandes ou des poissons fumés au goût intensément boisé. Ce mode de préparation unique provient du terme ancestral « boucan », qui désigne la grille en bois traditionnelle suspendue au-dessus d'un feu de bois.
