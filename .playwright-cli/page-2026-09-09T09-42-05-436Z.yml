            - paragraph [ref=f1e170]: Incontournable des tables dominicales et des repas en bord de mer, le civet zourite est un chef-d'œuvre de la cuisine créole. Ce plat d'une grande richesse aromatique met à l'honneur le poulpe (appelé localement "zourite") dans une version tropicalisée du civet traditionnel.
