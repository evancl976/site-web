            - paragraph [ref=f1e93]: Le blaff de poissons est l'expression même de la fraîcheur et de la légèreté de la cuisine côtière guyanaise. Il s'agit d'une préparation de poisson fraîchement pêché, poché à la minute dans un court-bouillon subtilement aromatisé.
