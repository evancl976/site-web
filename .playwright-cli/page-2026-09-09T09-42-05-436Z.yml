            - paragraph [ref=f1e159]: Véritable institution de l'île, le cabri massalé est un ragoût de caractère, à la fois riche et intensément parfumé. Il met à l'honneur une viande de cabri (jeune chèvre) fondante, sublimée par une torréfaction d'épices ancestrales.
