            - paragraph [ref=f1e247]: Véritable emblème de la cuisine familiale et réconfortante, le kangué est un ragoût de viande traditionnel de bœuf. Ce plat met à l'honneur la patience culinaire mahoraise en se concentrant sur un mode de cuisson lent qui sublime la qualité et le goût de la viande.
